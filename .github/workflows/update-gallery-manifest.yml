name: Update image manifests
on:
  push:
    branches: [main]
    paths:
      - 'images/gallery/**'
      - 'images/hero/**'
      - 'images/factory/**'
      - 'images/certifications/**'
      - 'images/careers/**'
      - 'scripts/generate-gallery.mjs'
      - 'scripts/generate-image-manifest.mjs'
      - '.github/workflows/update-gallery-manifest.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-image-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate gallery manifest
        run: node scripts/generate-gallery.mjs
      - name: Generate automatic image manifest
        run: node scripts/generate-image-manifest.mjs
      - name: Commit manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gallery.json data/image-manifest.json
          git diff --cached --quiet || git commit -m "chore: update gallery and image manifests"
          git pull --rebase origin main
          git push
