name: Update gallery manifest
on:
  push:
    branches: [main]
    paths:
      - 'images/gallery/**'
      - 'scripts/generate-gallery.mjs'
      - '.github/workflows/update-gallery-manifest.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-gallery-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/generate-gallery.mjs
      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gallery.json
          git diff --cached --quiet || git commit -m "chore: update gallery manifest"
          git pull --rebase origin main
          git push
